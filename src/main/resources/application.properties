spring.application.name=restaurant
server.port=8080
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://100.71.1.34:5432/pos_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:wx7I2dDf2xtVTep1}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JWT Secret (al menos 64 caracteres para firma HMAC-SHA de 512 bits)
spring.jwt.secret=${JWT_SECRET_KEY:restaurantSecretKeyForPOSSystemMustBeAtLeast64CharactersLong1234567890abcdef}

# Cookies Configuration
app.cookie.same-site=${COOKIE_SAME_SITE:Lax}
app.cookie.secure=${COOKIE_SECURE:false}

# Paginación Spring Data (Límite estricto de 100 por seguridad)
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}
